hydra:
  run:
    dir: ${output_dir}
  output_subdir: ${output_dir}/code/hydra           # Store hydra's config breakdown here for debugging
  searchpath:                                       # Only <exp_dir> in these paths are discoverable
    - pkg://navsim.planning.script.config.common

defaults:
  - default_common
  - default_evaluation
  - agent: IDOL_agent

num_scenes: 5
seed: 0
token_list: null

plot_types:
  - bev_frame
  - bev_agent
  - bev_candidates
  - bev_lidar
  - cameras
  - cameras_annotations
  - cameras_full
  - front_view
